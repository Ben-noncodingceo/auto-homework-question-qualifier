<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业题目质量评估系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .step {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .step-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .step-number {
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: bold;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8f0ff;
            border-color: #4c63d2;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .api-config {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-top: 20px;
        }

        select, input[type="text"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .latex-preview {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
        }

        .result-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-5px);
        }

        .question-number {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .difficulty {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        .difficulty-label {
            font-weight: bold;
            margin-right: 10px;
        }

        .difficulty-stars {
            color: #ffc107;
            font-size: 1.2em;
        }

        .keywords {
            margin-top: 15px;
        }

        .keyword-tag {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px 5px 5px 0;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .download-btn {
            margin-top: 20px;
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 作业题目质量评估系统</h1>
            <p>自动转换 PDF/DOCX 为 LaTeX，并使用 AI 评估题目难度</p>
        </div>

        <div class="content">
            <!-- Step 1: Upload File -->
            <div class="step">
                <div class="step-title">
                    <span class="step-number">1</span>
                    上传文件
                </div>
                <div class="upload-area" id="uploadArea">
                    <p style="font-size: 1.2em; margin-bottom: 10px;">📎 点击或拖拽文件到这里</p>
                    <p style="color: #666;">支持 PDF 和 DOCX 格式，最大 16MB</p>
                    <input type="file" id="fileInput" accept=".pdf,.docx">
                </div>
                <div id="fileInfo" class="hidden" style="margin-top: 20px; text-align: center;">
                    <p><strong>已选择文件：</strong> <span id="fileName"></span></p>
                    <button class="btn" id="convertBtn" style="margin-top: 15px;">转换为 LaTeX</button>
                </div>
            </div>

            <!-- Step 2: LaTeX Preview -->
            <div class="step hidden" id="latexStep">
                <div class="step-title">
                    <span class="step-number">2</span>
                    LaTeX 预览
                </div>
                <div id="questionInfo" style="margin-bottom: 20px;"></div>
                <div class="latex-preview" id="latexPreview"></div>
            </div>

            <!-- Step 3: AI Analysis -->
            <div class="step hidden" id="analysisStep">
                <div class="step-title">
                    <span class="step-number">3</span>
                    AI 难度分析
                </div>
                <div class="api-config">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">API 提供商</label>
                        <select id="apiProvider">
                            <option value="deepseek">DeepSeek</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">API 密钥</label>
                        <input type="text" id="apiKey" placeholder="输入你的 API 密钥">
                    </div>
                </div>
                <button class="btn" id="analyzeBtn" style="margin-top: 20px;">开始分析</button>
            </div>

            <!-- Step 4: Results -->
            <div class="step hidden" id="resultsStep">
                <div class="step-title">
                    <span class="step-number">4</span>
                    分析结果
                </div>
                <div id="resultsContainer"></div>
            </div>

            <!-- Loading -->
            <div class="loading hidden" id="loading">
                <div class="spinner"></div>
                <p>处理中，请稍候...</p>
            </div>

            <!-- Messages -->
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let uploadedFilePath = null;
        let currentQuestions = [];
        let latexContent = '';

        // Upload area interactions
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileInfo').classList.remove('hidden');
            uploadFile(file);
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            showLoading();

            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if (data.error) {
                    showMessage(data.error, 'error');
                } else {
                    uploadedFilePath = data.file_path;
                    showMessage('文件上传成功！', 'success');
                }
            })
            .catch(error => {
                hideLoading();
                showMessage('上传失败：' + error, 'error');
            });
        }

        document.getElementById('convertBtn').addEventListener('click', () => {
            if (!uploadedFilePath) {
                showMessage('请先上传文件', 'error');
                return;
            }

            showLoading();

            fetch('/api/convert', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({file_path: uploadedFilePath})
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if (data.error) {
                    showMessage(data.error, 'error');
                } else {
                    latexContent = data.latex_content;
                    currentQuestions = data.questions;
                    displayLatex(data);
                    showMessage('转换成功！找到 ' + data.question_count + ' 个题目', 'success');
                }
            })
            .catch(error => {
                hideLoading();
                showMessage('转换失败：' + error, 'error');
            });
        });

        function displayLatex(data) {
            document.getElementById('latexStep').classList.remove('hidden');
            document.getElementById('analysisStep').classList.remove('hidden');

            document.getElementById('questionInfo').innerHTML =
                `<p><strong>✓ 找到 ${data.question_count} 个题目</strong></p>`;

            document.getElementById('latexPreview').textContent = data.latex_content;
        }

        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showMessage('请输入 API 密钥', 'error');
                return;
            }

            if (currentQuestions.length === 0) {
                showMessage('没有题目需要分析', 'error');
                return;
            }

            showLoading();

            fetch('/api/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    questions: currentQuestions,
                    api_provider: document.getElementById('apiProvider').value,
                    api_key: apiKey
                })
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if (data.error) {
                    showMessage(data.error, 'error');
                } else {
                    displayResults(data.results);
                    showMessage('分析完成！', 'success');
                }
            })
            .catch(error => {
                hideLoading();
                showMessage('分析失败：' + error, 'error');
            });
        });

        function displayResults(results) {
            document.getElementById('resultsStep').classList.remove('hidden');
            const container = document.getElementById('resultsContainer');

            let html = '<div class="results-grid">';
            results.forEach(result => {
                const stars = '★'.repeat(result.difficulty) + '☆'.repeat(5 - result.difficulty);
                const keywords = result.keywords.map(k =>
                    `<span class="keyword-tag">${k}</span>`
                ).join('');

                html += `
                    <div class="result-card">
                        <div class="question-number">题目 ${result.question_number}</div>
                        <div class="difficulty">
                            <span class="difficulty-label">难度：</span>
                            <span class="difficulty-stars">${stars}</span>
                            <span style="margin-left: 10px;">${result.difficulty}/5</span>
                        </div>
                        <div class="keywords">
                            <strong>知识点：</strong><br>
                            ${keywords}
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            container.innerHTML = html;
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'error' ? 'alert-error' : 'alert-success';
            const alertHtml = `<div class="alert ${alertClass}">${message}</div>`;
            messagesDiv.innerHTML = alertHtml;

            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
