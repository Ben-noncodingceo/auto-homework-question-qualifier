name = "homework-analyzer-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Environment variables (non-sensitive)
[vars]
ALLOWED_ORIGINS = "https://your-domain.pages.dev,http://localhost:8788"

# Secrets (sensitive data - set via CLI)
# wrangler secret put DEEPSEEK_API_KEY
# wrangler secret put DOUBAO_API_KEY
# wrangler secret put TONGYI_API_KEY

# Workers AI binding (for PDF/Word parsing)
[ai]
binding = "AI"

# R2 bucket for temporary file storage (optional)
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "homework-uploads"

# KV namespace for caching (optional)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"
